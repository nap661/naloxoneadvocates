<h1>Volunteer with Us</h1>
<p>Sign up to support harm reduction work in Plymouth.</p>
<form action="https://formsubmit.co/napplymouth66@gmail.com" method="POST">
 <input type="hidden" name="_captcha" value="false">
 <label>Full Name</label><br>
 <input type='text' name='name' required><br><br>
 <label>Email</label><br>
 <input type='email' name='email' required><br><br>
 <label>Phone (optional)</label><br>
 <input type='text' name='phone'><br><br>
 <label>Volunteer Role</label><br>
 <select name='role'>
  <option>Peer Trainer</option>
  <option>Outreach Volunteer</option>
  <option>Support Team</option>
 </select><br><br>
 <label>Availability</label><br>
 <textarea name='availability'></textarea><br><br>
 <label>Additional Notes</label><br>
 <textarea name='notes'></textarea><br><br>
 <button type='submit' class='btn'>Submit</button>
</form>
